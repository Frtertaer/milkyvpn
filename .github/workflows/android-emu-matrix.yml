name: android-emu-matrix

# MilkyVPN scenario battery across the supported API floor→ceiling.
# Needs a KAL2_TEST_LINK secret holding a kal2:// test profile.
on:
  workflow_dispatch:
  push:
    paths: ["android/**", "lib/**", "milky-core/**", "testing/**", ".github/workflows/android-emu-matrix.yml"]

permissions:
  contents: read

jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 31, 34, 35]
    steps:
      - uses: actions/checkout@v4

      - name: require KAL2_TEST_LINK
        env:
          KAL2_TEST_LINK: ${{ secrets.KAL2_TEST_LINK }}
        run: |
          [ -n "$KAL2_TEST_LINK" ] || {
            echo "::error::secret KAL2_TEST_LINK is not set — add a kal2:// test profile"
            exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: milky-core/go.mod
      # hosted runners ship an Android SDK at $ANDROID_HOME — put its tools on PATH
      # (setup-android@v3 tries to install the removed 'tools' package and fails)
      - name: android sdk on PATH
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)
          [ -n "$SDKM" ] || { echo "::error::no cmdline-tools in $ANDROID_HOME"; exit 1; }
          echo "$SDKM:$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: KVM check
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm trigger --name-match=kvm || true

      - name: build libcore.so (android x86_64, JNI + milky ABI)
        working-directory: milky-core
        run: |
          yes | sdkmanager --install 'ndk;26.3.11579264' >/dev/null
          NDK="$ANDROID_HOME/ndk/26.3.11579264"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang" \
            CGO_ENABLED=1 GOOS=android GOARCH=amd64 \
            go build -buildmode=c-shared -o /tmp/libcore.so ./cmd/kal2native
          mkdir -p ../android/app/src/main/jniLibs/x86_64
          cp /tmp/libcore.so ../android/app/src/main/jniLibs/x86_64/libcore.so

      - name: build debug APK
        run: flutter build apk --debug

      - name: emulator run (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            KAL2_TEST_LINK='${{ secrets.KAL2_TEST_LINK }}' \
              ./testing/scenarios.sh --apk build/app/outputs/flutter-apk/app-debug.apk \
                --serial emulator-5554 --scenario connect
            for s in wifi_lte net_loss dns_change dns_leak fgs_doze; do
              ./testing/scenarios.sh --serial emulator-5554 --scenario "$s" || true
            done

      - name: logcat on failure
        if: failure()
        run: timeout 20 $ANDROID_HOME/platform-tools/adb logcat -d 2>/dev/null | tail -300 || true
