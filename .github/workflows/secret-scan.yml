name: secret-scan
on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks on git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"

  pr-body-scan:
    # credentials have leaked via bot comments/PR bodies before — scan the
    # text fields, not only the diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: grep PR title/body for credential patterns
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$TITLE" "$BODY" > /tmp/prtext.txt
          if grep -nE 'kal2://[0-9a-f]{64}@|sshpass -p|psk["'"'"' :=]+[0-9a-f]{64}|password["'"'"' :=]+[0-9a-f-]{20,}|BEGIN [A-Z ]*PRIVATE KEY' /tmp/prtext.txt; then
            echo "::error::credential-like material in PR title/body — rotate it, don't publish it"
            exit 1
          fi
          echo "clean"
