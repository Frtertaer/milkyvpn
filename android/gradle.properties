org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Android 7 floor (API 24). libflutter.so references __fwrite_chk, which exists
# only from API 24 — on API 23 the app installs but dies at startup with
# UnsatisfiedLinkError, so a lower floor only buys a guaranteed launch crash.
flutter.minSdkVersion=24
